<ion-content>
  <app-header (navigation)="navigation()" [HEADING_TEXT]="this.HEADING" [IS_BACK]="true"></app-header>
  
  <ion-grid class="fisrt_div ion-margin">
    <ion-row>
      <ion-col size="6">
        <ion-button expand="block">
          <ion-text>
            Opening Hours
          </ion-text>
        </ion-button>
      </ion-col>
      <ion-col size="6">
        <ion-button expand="block">
          <ion-text>
            Contact us
          </ion-text>
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-list lines="none">
    <ion-item button 
      *ngFor="let value of this.STAFF_LIST" 
      class="staff_list" 
      detail="false" 
      [routerLink]="['/staff-service-details', value.id]"
      >
      
        <ion-thumbnail slot="start">
          <img [src]="this.imageService.DEFAULT_PERSON">
        </ion-thumbnail>
        <ion-label> <h3>{{ value.firstName }} {{ value.lastName }}</h3>  </ion-label>
      
    </ion-item>
  </ion-list>
</ion-content>
<app-footer></app-footer>
