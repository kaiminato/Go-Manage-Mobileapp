<ion-content>
  <app-header (navigation)="navigation()" [HEADING_TEXT]="this.HEADING" [IS_BACK]="true"></app-header>

  <ion-list lines="none" class="ion-margin-top" >
    
    <ion-item button  class="details ion-margin-top"   detail="false">
          
      <ion-text class="ion-margin-bottom"> 3 june 2022 at 9:00am 
        <br/>
        <ion-text>60 minuts duration, ends at 10:00am</ion-text>
      </ion-text>
        
    </ion-item>


    <ion-item button  class="details ion-margin-top"   detail="false">
          
      
      <ion-text class="ion-margin-bottom"> Jade amber beauty studio Corogin galway</ion-text>
      <ion-img slot="end" [src]="this.imageService.LOGO" class="ion-margin-bottom"></ion-img>
    </ion-item>

    <ion-item button  class="details ion-margin-top"   detail="false">
          
      
      <ion-text class="ion-margin-bottom"> File and Polish Nail
        <br/>
        <ion-text>60 mins with Jade</ion-text>
      </ion-text>

      <ion-text slot="end" class="ion-margin-bottom"> $30.00</ion-text>

    </ion-item>


    <ion-item button  class="details_no_border ion-no-border ion-margin-top"   detail="false">
          
      
      <ion-text class="ion-margin-bottom ion-margin-top"> Total
      </ion-text>

      <ion-text slot="end" class="ion-margin-bottom ion-margin-top"> $30.00</ion-text>

    </ion-item>

    <ion-item button  class="details_no_border ion-no-border ion-margin-top"   detail="false">
          
      
      

      <ion-button slot="end" class="ion-margin-bottom ion-margin-top" [routerLink]="['/booking-complete']"> Confirm</ion-button>

    </ion-item>

    
  </ion-list>
</ion-content>

<app-footer></app-footer>
