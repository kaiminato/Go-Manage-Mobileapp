<ion-content style="--background: {{this.dataService.BACKGROUND_COLOR}};">
  <app-header (navigation)="navigation()"  [HEADING_TEXT]="this.HEADING" [IS_BACK]="true" ></app-header>
  <div class="green-background" style="background : {{this.dataService.TEXT_COLOR}}!important; ">
  </div>
  <ion-card style="color : {{this.dataService.TEXT_COLOR}} !important; " class="page-title">
    <h2>Your Booking</h2>
  </ion-card>

  <div class="card-list">
    <ion-grid>
      <ion-row>
        <ion-col size="12" class="new_booking_div" style="background : {{this.dataService.TEXT_COLOR}}!important; ">
          <ion-text class="new_booking_txt">New Booking</ion-text>
          <ion-button
            fill="clear"
            class="ion-float-right new_booking_btn"
            [routerLink]="['/make-a-booking']"
            style="color : {{this.dataService.TEXT_COLOR}}!important; "
            >+</ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>

    <ion-grid class="booking-header-grid-section">
      <ion-row>
        <ion-col size="12" class="booking-header-section">
          <div class="booking-selection-div">
            <div
              class="booking-selection future ion-text-center "
              style="border : 2px solid {{this.dataService.TEXT_COLOR}}"
              [ngStyle]="{
                'background-color': IS_FUTURE_BOOKING_active ? this.dataService.BUTTON_COLOR : 'white',
               'color': IS_FUTURE_BOOKING_active ? 'white' : this.dataService.BUTTON_COLOR}"
              [class.active-booking-selection]="IS_FUTURE_BOOKING_active"
              (click)="IS_FUTURE_BOOKING_active = true"
              >Future Bookings
            </div>
          </div>
          <div class="booking-selection-div">
            <div
              class="booking-selection future ion-text-center"
              style="border : 2px solid {{this.dataService.TEXT_COLOR}}"
              [ngStyle]="{
                'background-color': !IS_FUTURE_BOOKING_active ? this.dataService.BUTTON_COLOR : 'white',
               'color': !IS_FUTURE_BOOKING_active ? 'white' : this.dataService.BUTTON_COLOR}"
              [class.active-booking-selection]="!IS_FUTURE_BOOKING_active"
              (click)="IS_FUTURE_BOOKING_active = false"
              >Previous Bookings
            </div>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>

    <div class="main-div">
      <ion-card class="booking_list list_{{i}}" *ngFor="let booking of IS_FUTURE_BOOKING_active ? FUTURE_BOOKING_LIST : RECENT_BOOKING_LIST; let i = index" >
        <ion-card-header>
          <ion-card-subtitle class="booking-time">
            <a *ngIf="IS_FUTURE_BOOKING_active" href="{{booking.paymentReceipt}}" target=”_blank” class="receipt_btn" style="color : {{this.dataService.TEXT_COLOR}}; border : 1px solid {{this.dataService.TEXT_COLOR}}">RECEIPT<ion-icon name="arrow-down-outline"></ion-icon></a>
            <ion-icon name="calendar" style="color : {{this.dataService.TEXT_COLOR}}"></ion-icon> <ion-text style="color : {{this.dataService.TEXT_COLOR}} !important;"> {{booking.date_time}}</ion-text>
          </ion-card-subtitle>
          <ion-card-content class="ion-no-padding" >
            <div class="card-content" >
              <div class="booking-content service_info" style="color : {{this.dataService.TEXT_COLOR}} !important; ">
                <div class="service_name"> {{booking.service_name}}</div>
                <div class="service_duration"> {{booking.service_duration}} </div>
                <div class="owner_name"> Jade Amber </div>
              </div>
              <div class="booking-content">
                <ion-img [src]="this.imageService.SERIVCE_IMG"></ion-img>
              </div>
            </div>
          </ion-card-content>
          <div *ngIf="IS_FUTURE_BOOKING_active" class="rescheduling-header-section">
            <div
              class="rescheduling-selection ion-text-center "
              [class.active-rescheduling-selection]="false"
              style="color : {{this.dataService.TEXT_COLOR}}; border : 2px solid {{this.dataService.TEXT_COLOR}}"
              expand="full"
              size="small"
              [routerLink]="['/make-a-booking']"
              [queryParams]="{id: booking.id}"
              >
              Rescheduling booking
            </div>
            <div
              class="rescheduling-selection ion-text-center"
              [class.active-rescheduling-selection]="true"
              style="background-color : {{this.dataService.TEXT_COLOR}}; border : 2px solid {{this.dataService.TEXT_COLOR}}"
              expand="full"
              size="small"
              (click)="cancelBooking(booking.id)"
              >
              Cancel booking
            </div>
          </div>
          <div *ngIf="!IS_FUTURE_BOOKING_active" class="previous-receipt-section">
            <a href="{{booking.paymentReceipt}}" target=”_blank” class="reciept_payment" style="background-color : {{this.dataService.BUTTON_COLOR}}">
              Receipt
            </a>
          </div>
        </ion-card-header>
      </ion-card>
    </div>
  </div>

</ion-content>
<app-footer></app-footer>
