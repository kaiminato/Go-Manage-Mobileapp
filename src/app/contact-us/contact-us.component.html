          <ion-icon name="time"></ion-icon>
        </ion-col>
        <ion-col size="8" class="ion-text-center hours">
          <div class="hours-heading"> Opening Hours </div>
          <div> Tuesday 10am - 8am </div>

          <div> Tuesday 10am - 8am </div>
          <div> Tuesday 10am - 8am </div>

        <ion-col size="4" class="ion-align-self-center">
