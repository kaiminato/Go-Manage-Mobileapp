<ion-content>
  <div class="" style="background : {{this.dataService.BUTTON_COLOR}}!important; ">
  as</div>
  <app-header (navigation)="navigation()" [HEADING_TEXT]="this.HEADING" [IS_BACK]="true"></app-header>
  <ion-card style="color : {{this.dataService.TEXT_COLOR}} !important; " class="page-title">
    <h2>Feedbacks / Review</h2>
  </ion-card>
  <ion-card class="card-list">
    <ion-card-header class="ion-text-center">
      <ion-card-title>
        <img [src]="this.imageService.JADE_SIGN_IMG" style="width: 100%;">
      </ion-card-title>
      <ion-item class="staff_dropdown">
        <ion-label></ion-label>
        <ion-select class="staff_select" [(ngModel)]="selectedOption" (ionChange)="onOptionChange()" interface="popover">
          <ion-select-option  *ngFor="let staff of STAFF_LIST; let staff_index = index" [value]="staff.employee_id">{{staff.firstName}}  {{staff.lastName}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-card-subtitle style="color : {{this.dataService.TEXT_COLOR}}!important">Please write your feedback</ion-card-subtitle>

    </ion-card-header>

    <ion-card-content style="border : 2px solid {{this.dataService.TEXT_COLOR}}!important">
      <ion-textarea rows="6" [(ngModel)]="REVIEW_TEXT" #myTextarea></ion-textarea>
      <div class="star-icons">
        <ion-icon name="star" (click)="setRating(1)" [class.active]="currentRating >= 1"></ion-icon>
        <ion-icon name="star" (click)="setRating(2)" [class.active]="currentRating >= 2"></ion-icon>
        <ion-icon name="star" (click)="setRating(3)" [class.active]="currentRating >= 3"></ion-icon>
        <ion-icon name="star" (click)="setRating(4)" [class.active]="currentRating >= 4"></ion-icon>
        <ion-icon name="star" (click)="setRating(5)" [class.active]="currentRating == 5"></ion-icon>
      </div>
    </ion-card-content>
    <ion-button
      expand="block"
      class="btn_checkout"
      (click)="addReview()"
      style="--background:{{this.dataService.BUTTON_COLOR}} !important; --background-activated : {{this.dataService.BUTTON_COLOR}} !important;"> SUBMIT REVIEW</ion-button>
  </ion-card>
</ion-content>
<app-footer></app-footer>
