<ion-content style="--background: {{this.dataService.BUTTON_COLOR}}; color : {{this.dataService.BUTTON_COLOR}} !important ">
  <div class="green-background" style="background : {{this.dataService.BUTTON_COLOR}}!important; ">
  </div>
  <app-book-now-header (navigation)="navigation()" [HEADING_TEXT]="this.HEADING" [BOOKING_WITH_STAFF]="false" [IS_BACK]="true"></app-book-now-header>

  <ion-card style="color : {{this.dataService.TEXT_COLOR}} !important; " class="page-title">
    <h2>Select a time</h2>
  </ion-card>
  <div class="card-list">
    <ion-grid class="month_name" style="background : {{this.dataService.TEXT_COLOR}}!important; ">
      <ion-row >
        <ion-col size="12" class="ion-text-center ">
          <ion-text style="font-size: 25px; margin-left: 30px;">{{ CURRENT_MONTH_VALUE }}</ion-text>
          <ion-icon name="calendar-outline" class="ion-float-right" (click)="openPicker()"></ion-icon>
        </ion-col>
      </ion-row>

      <ion-row class="date-range-picker" *ngIf="DAYS_ARRAY">
        <ion-col size="12">
        <ion-slides pager="false" [options]="slideOpts" #mySlider >
          <ion-slide *ngFor="let value of DAYS_ARRAY;let i = index">

            <div  class="date-range">
              <div class="day-name">
                {{value.day_name}}
              </div>
              <ion-text class="ion-text-uppercase" [class.active]=" value.is_active"
              [class.disabled]=" value.is_disabled"
              (click)="_selectDateRangeSlider(value.day_number, value.is_disabled, value.month, value.year , i)">
                <b>{{value.day_number}} </b>
              </ion-text>
            </div>

          </ion-slide>

        </ion-slides>
        </ion-col>

      </ion-row>
    </ion-grid>

    <ion-grid class="all_shift">
      <ion-row>
        <ion-col size="12" class="heading"><ion-text class="ion-text-bold"></ion-text></ion-col>
        <ion-col
          size="4"
          class="ion-text-center ion-margin-top"
          *ngFor="let shift of ALL_SHIFT"
          (click)="_selectTiming(shift.id , shift.is_disabled)"
          >
          <div [class.active] ="shift.is_active" [class.disbaled_shift] ="shift.is_disabled" style="color : {{this.dataService.TEXT_COLOR}};">
            <ion-icon name="time-outline"></ion-icon>
            <ion-text class="time"> {{ shift.time }}</ion-text>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <ion-modal [isOpen]="IS_CALNDER_OPEN" [breakpoints]="[0.1, 0.5, 1]" [initialBreakpoint]="0.8" trigger="topen-calender">

    <ng-template>
      <ion-calendar [(ngModel)]="date"
          (change)="_onDateSelect($event.format('YYYY-MM-DD'))"
          [options]="options"

          [type]="DATE_TYPE"
          [format]="'YYYY-MM-DD'">
      </ion-calendar>

    </ng-template>
  </ion-modal>


</ion-content>
