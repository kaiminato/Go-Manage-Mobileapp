<ion-content>
  <app-header (navigation)="navigation()" [HEADING_TEXT]="this.HEADING" [IS_BACK]="true"></app-header>
  
  <ion-grid class="request-tabs">
    <ion-row>
      <ion-col size="6"  [class]="IS_STAFF  ? 'active' : 'inactive'" (click)="IS_STAFF = true;">
        
        <div>
          <ion-text  class="app-text-color ion-margin-start">Staff</ion-text>
        </div>
      </ion-col>
      
      <ion-col size="6"  [class]=" !IS_STAFF  ? 'active' : 'inactive'" (click)="IS_STAFF = false;">
       <div>
        <ion-text  class="app-text-color ion-margin-start">Services</ion-text>
       </div>
        
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-list lines="none" *ngIf="IS_STAFF">
    <ion-item button 
      *ngFor="let value of this.STAFF_LIST" 
      class="staff_list" 
      detail="false" 
      [routerLink]="['/staff-service-details', value.id]"
      >
      
        <ion-thumbnail slot="start">
          <img [src]="this.imageService.DEFAULT_PERSON">
        </ion-thumbnail>
        <ion-label> <h3>{{ value.firstName }} {{ value.lastName }}</h3>  </ion-label>
      
    </ion-item>
  </ion-list>

  <ion-list lines="none" *ngIf="!IS_STAFF">
    <ion-item button 
      *ngFor="let value of this.SERVICE_LIST" 
      class="staff_list" 
      detail="false" >

        <ion-thumbnail slot="start">
          <img [src]="value.image">
        </ion-thumbnail>
        <ion-label> <h3>{{ value.name }}</h3>  </ion-label>
      
    </ion-item>
  </ion-list>


  

  
  

</ion-content>
<app-footer></app-footer>
