<ion-content>
  <app-book-now-header (navigation)="navigation()" [HEADING_TEXT]="this.HEADING" [IS_BACK]="true"></app-book-now-header>
  
  <ion-grid class="request-tabs">
    <ion-row>
      <ion-col size="6"  [class]="IS_STAFF  ? 'active' : 'inactive'" (click)="IS_STAFF = true;">
        
        <div>
          <ion-text  class="app-text-color ion-margin-start">Staff</ion-text>
        </div>
      </ion-col>
      
      <ion-col size="6"  [class]=" !IS_STAFF  ? 'active' : 'inactive'" (click)="IS_STAFF = false;">
       <div>
        <ion-text  class="app-text-color ion-margin-start">Services</ion-text>
       </div>
        
      </ion-col>
    </ion-row>
  </ion-grid>

  <div class="list">
    <ion-list lines="none" *ngIf="IS_STAFF">
      <ion-item button 
        *ngFor="let value of this.STAFF_LIST" 
        class="staff_list" 
        detail="false" 
        
        (click)="SelectStaff(value.id)"
        >
        
          <ion-thumbnail slot="start">
            <img [src]="this.imageService.DEFAULT_PERSON">
          </ion-thumbnail>
          <ion-label> <h3>{{ value.firstName }} {{ value.lastName }}</h3>  </ion-label>
        
      </ion-item>
    </ion-list>
  </div>
    

  <!-- <ion-list lines="none" *ngIf="!IS_STAFF">
    <ion-item button 
      *ngFor="let value of this.SERVICE_LIST" 
      class="staff_list" 
      detail="false" >

        <ion-thumbnail slot="start">
          <img [src]="value.image">
        </ion-thumbnail>
        <ion-label> <h3>{{ value.name }}</h3>  </ion-label>
      
    </ion-item>
  </ion-list> -->
  <div class="list">
    <ion-list lines="none" class="ion-margin-start ion-margin-end"  [class.ion-hide]="IS_STAFF" *ngFor="let service of CATEGORY_LIST; let service_index = index">
      
      <ion-item button  class="service_detail"   detail="false" (click)="changeServiceStatus(service_index, service.is_open)">
          <ion-label> <h3>{{ service.category_name }}</h3>  </ion-label>
          <ion-text class="service_count">{{ service?.count }} Service </ion-text>
          <ion-icon 
            [name]=" service.is_open ? 'chevron-down-outline' : 'chevron-forward-outline' " class="toggle">
          </ion-icon>
      </ion-item>

      <ion-grid *ngIf="service.is_open">
        <ion-row *ngFor="let service_detail of service.services" class="service_order_list">
          <ion-col size="1" ></ion-col>
          <ion-col size="11" >
            
            <ion-item class="service_detail ion-no-padding"   detail="false"  >
              <ion-icon name="information-circle-outline"></ion-icon>
              <ion-label> <h3>{{ service_detail.serviceName }}</h3>  </ion-label>
              <ion-text class="service_count"> {{ service_detail.servicePrice }} </ion-text>
              <ion-checkbox slot="end" ></ion-checkbox>
            </ion-item>
          </ion-col>
        </ion-row>
      </ion-grid>
      
    </ion-list>
  </div>


  

  
  

</ion-content>
<app-footer></app-footer>
