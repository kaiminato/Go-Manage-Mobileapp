<ion-header>
  <ion-toolbar>
    <ion-row>
      
      <ion-col size="2">
        <span class="material-symbols-outlined" (click)="back()" *ngIf="IS_BACK">
          arrow_back
        </span>
      </ion-col>

      <ion-col size="10">
        <div class="header-text">
          <div class="circle" > 1</div>
          <ion-text>
            {{ this.HEADING_TEXT }}
          </ion-text>
        </div>
      </ion-col>
    
    </ion-row>
    
  </ion-toolbar>
</ion-header>
