<ion-footer class="ion-no-border">
  <ion-toolbar>

    <ion-tabs>
      <ion-tab-bar slot="bottom" style="--background : {{this.dataService.BUTTON_COLOR}}">


        <ion-tab-button [routerLink]="['/']">
          <ion-img [src]="this.imageService.HOME"></ion-img>
          <ion-text>Home</ion-text>
        </ion-tab-button>

        <ion-tab-button [routerLink]="['/my-booking-list']">
          <ion-img [src]="this.imageService.BOOKING"></ion-img>
          <ion-text>Bookings</ion-text>
        </ion-tab-button>


        <ion-tab-button [routerLink]="['/profile']">
          <ion-img [src]="this.imageService.PROFILE"></ion-img>
          <ion-text>Profile</ion-text>
        </ion-tab-button>

        <ion-tab-button (click)="logout()" *ngIf="IS_LOGIN">
          <ion-img [src]="this.imageService.LOGOUT"></ion-img>
          <ion-text>Logout</ion-text>
        </ion-tab-button>

        <ion-tab-button (click)="login()" *ngIf="!IS_LOGIN">
          <ion-icon name="log-in"></ion-icon>
          <ion-text>Login</ion-text>
        </ion-tab-button>
