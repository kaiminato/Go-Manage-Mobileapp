<ion-content>
  <app-header (navigation)="navigation()" [HEADING_TEXT]="this.HEADING" [IS_BACK]="true"></app-header>

  <ion-grid class="staff-details ion-margin-top">
    <ion-row>
      <ion-col size="4">
        <ion-avatar>
          <ion-img [src]="USER_INFO.image"></ion-img>
        </ion-avatar>
      </ion-col>
      <ion-col size="8">
        <div class="comment"> {{ USER_INFO.comment }} </div>
      </ion-col>
    </ion-row>
  </ion-grid>

  
  <ion-list lines="none" class="ion-margin-start ion-margin-end" *ngFor="let service of USER_INFO.service_list; let service_index = index">
    
    <ion-item button  class="service_detail"   detail="false" (click)="changeServiceStatus(service_index, service.is_open)">
        <ion-label> <h3>{{ service.name }}</h3>  </ion-label>
        <ion-text class="service_count">{{ service?.count }} Service </ion-text>
        <ion-icon 
          [name]=" service.is_open ? 'chevron-down-outline' : 'chevron-forward-outline' " class="toggle">
        </ion-icon>
    </ion-item>

    <ion-grid *ngIf="service.is_open">
      <ion-row *ngFor="let service_detail of service.services" class="service_order_list">
        <ion-col size="1" ></ion-col>
        <ion-col size="11" >
          
          <ion-item class="service_detail ion-no-padding"   detail="false"  >
            <ion-icon name="information-circle-outline"></ion-icon>
            <ion-label> <h3>{{ service_detail.name }}</h3>  </ion-label>
            <ion-text class="service_count"> {{ service_detail.price }} </ion-text>
            <ion-checkbox slot="end" ></ion-checkbox>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>
    
  </ion-list>


  <ion-grid>
    <ion-row class="book_now">
      <ion-col size="6" class="ion-text-center service_selected_price">
        <div>1 service selected</div>
        <div>$30.00</div>
      </ion-col>
      <ion-col size="6">
        <ion-button expand="block" [routerLink]="['/select-a-time']">Book now</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
  
</ion-content>

<app-footer></app-footer>
